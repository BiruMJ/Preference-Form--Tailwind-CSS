<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Preference Form</title>
</head>

<body class="bg-amber-100">
    <main class="w-11/12 mx-auto max-w-5xl">
        <h1 class="text-amber-900 font-bold font-serif text-5xl my-4">Leaf &amp; Brew Box</h1>
        <h2 class="text-amber-800 font-bold text-2xl">Preferences</h2>

        <form method="post" action="#" class="bg-white my-4 relative p-4 flex flex-col gap-4 rounded-md">
            <!-- SUBSCRIPTION -->
            <fieldset class="flex flex-col gap-4 md:grid md:grid-cols-2 md:grid-rows-auto">
                <legend class="text-amber-700 font-bold text-xl my-2">Subscription</legend>

                <!-- SUBSCRIPTION TIER -->
                <section class="my-4 lg:my-0">
                    <label class="font-bold text-sm block mb-1">Subscription Tier</label>
                    <select title="Subscription plans" class="border w-full border-amber-400 py-1 p-2 text-sm rounded-sm">
                        <option>Basic (1 tea per month)</option>
                        <option>Standard (3 teas per month)</option>
                        <option>Deluxe (5 teas per month)</option>
                    </select>
                </section>

                <!-- TASTE PREFERENCE -->
                <section>
                    <p class="font-bold text-sm mb-1">Taste Preference</p>
                    <section class="text-sm flex flex-col gap-1">
                        <section>
                            <input type="checkbox" id="fruity" name="fruity" />
                            <label for="fruity">Fruity</label>
                        </section>
                        <section>
                            <input type="checkbox" id="floral" name="floral" />
                            <label for="floral">Floral</label>
                        </section>
                        <section>
                            <input type="checkbox" id="sweet" name="sweet" />
                            <label for="sweet">Sweet</label>
                        </section>
                    </section>
                </section>

                <!-- LOOSE OR BAGGED -->
                <section>
                    <p class="font-bold text-sm mb-1">Loose Leaf or Bagged?</p>
                    <section class="text-sm flex flex-col gap-1">
                        <section>
                            <input type="radio" id="loose" name="tea-preference" />
                            <label for="loose">Loose</label>
                        </section>
                        <section>
                            <input type="radio" id="bagged" name="tea-preference" />
                            <label for="bagged">Bagged</label>
                        </section>
                        <section>
                            <input type="radio" id="either" name="tea-preference" />
                            <label for="either">Either</label>
                        </section>
                    </section>
                </section>

                <!-- DIETARY RESTRICTIONS -->
                <section class="my-4 row-start-2 lg:my-0">
                    <label class="font-bold text-sm block mb-1" for="delivery_instructions">Dietary Restrictions</label>
                    <textarea
                        class="w-full focus:bg-amber-50 focus:outline-lime-500 border border-amber-400 p-2 text-sm"
                        id="delivery_instructions"></textarea>
                </section>

            </fieldset>

            <!-- CUSTOMER DETAILS -->
            <fieldset class="flex flex-col md:grid md:grid-cols-2 md:gap-4 md:grid-row-auto">
                <div class="mt-6 flex justify-between items-center col-span-2">
                    <legend class="text-amber-700 text-xl font-bold">Details</legend>
                    <!-- DELIVERY ICON -->
                    <svg class="fill-amber-700 h-10" xmlns="http://www.w3.org/2000/svg" height="50px"
                        viewBox="0 -960 960 960" width="50px">
                        <path
                            d="M240-160q-50 0-85-35t-35-85H40v-440q0-33 23.5-56.5T120-800h560v160h120l120 160v200h-80q0 50-35 85t-85 35q-50 0-85-35t-35-85H360q0 50-35 85t-85 35Zm0-80q17 0 28.5-11.5T280-280q0-17-11.5-28.5T240-320q-17 0-28.5 11.5T200-280q0 17 11.5 28.5T240-240Zm480 0q17 0 28.5-11.5T760-280q0-17-11.5-28.5T720-320q-17 0-28.5 11.5T680-280q0 17 11.5 28.5T720-240Zm-40-200h170l-90-120h-80v120Z" />
                    </svg>
                </div>


                <!-- NAME -->
                <section>
                    <label class="font-bold text-sm mb-1 block">Full Name</label>
                    <input title="full name" class="w-full border border-amber-400 px-3 py-2 text-sm" type="text" value="Earl Greyson" />
                </section>

                <!-- EMAIL -->
                <section>
                    <label class="font-bold text-sm mb-1 block">Email</label>
                    <input title="email" class="w-full border border-amber-400 px-3 py-2 text-sm" type="email"
                        value="earlgreyson@tealovers.com" />
                </section>

                <!-- DELIVERY -->
                <section>
                    <h3 class="font-bold text-sm mb-1 block">Delivery Address</h3>
                    <section class="w-full border border-amber-400 px-3 py-2 text-sm rounded-md hover:bg-amber-50">
                        <p>12 Brewster Lane</p>
                        <p>Steepville</p>
                        <p>TE 67894</p>
                        <a href="#" class="underline text-amber-700 mt-2 font-semibold cursor-pointer">Change
                            address</a>
                    </section>
                </section>

                <!-- PAYMENT -->
                <section>
                    <h3 class="font-bold text-sm mb-1 block">Payment Method</h3>
                    <section class="w-full border border-amber-400 px-3 py-2 text-sm rounded-md hover:bg-amber-50">
                        <section class="flex justify-between mb-2">
                            <p>....8523</p>
                            <section class="flex">
                                <img class="h-5" src="img/logo_visa.png" alt="visa" />
                                <img class="h-5" src="img/logo_mastercard.png" alt="mastercard" />
                            </section>
                        </section>
                        <a href="#" class="underline text-amber-700 mt-2 font-semibold cursor-pointer">Change payment
                            method</a>
                    </section>
                </section>

            </fieldset>

            <!-- SAVE BUTTON -->
            <input
                class="block mt-8 bg-amber-700 rounded-md text-center w-full p-4 text-white font-bold hover:bg-amber-800 cursor-pointer"
                type="submit" value="Save Preferences" />

            <!-- FORM ICON -->
            <svg class="absolute -top-8 -right-1 fill-amber-700 h-20" xmlns="http://www.w3.org/2000/svg" height="100px"
                viewBox="0 -960 960 960" width="100px">
                <path
                    d="M160-120v-80h640v80H160Zm560-520h80v-120h-80v120ZM320-280q-66 0-113-47t-47-113v-400h200v96l-72 58q-2 2-8 16v170q0 8 6 14t14 6h160q8 0 14-6t6-14v-170q0-2-8-16l-72-58v-96h400q33 0 56.5 23.5T880-760v120q0 33-23.5 56.5T800-560h-80v120q0 66-47 113t-113 47H320Z" />
            </svg>

    </main>
    </form>
    <footer>
        <svg class="fill-amber-700 mx-auto my-4 h-5" xmlns="http://www.w3.org/2000/svg" height="24px"
            viewBox="0 -960 960 960" width="24px">
            <path
                d="M160-120v-80h640v80H160Zm160-160q-66 0-113-47t-47-113v-400h640q33 0 56.5 23.5T880-760v120q0 33-23.5 56.5T800-560h-80v120q0 66-47 113t-113 47H320Zm0-480h320-400 80Zm400 120h80v-120h-80v120ZM560-360q33 0 56.5-23.5T640-440v-320H400v16l72 58q2 2 8 16v170q0 8-6 14t-14 6H300q-8 0-14-6t-6-14v-170q0-2 8-16l72-58v-16H240v320q0 33 23.5 56.5T320-360h240ZM360-760h40-40Z" />
        </svg>
    </footer>
</body>

</html>
